<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="content" class="tela">

    <header class="cabecalho">
        <div>
            <div class="sobretitulo" th:text="${aVenda + ' à venda · ' + pausados + (pausados == 1 ? ' pausado' : ' pausados')}"></div>
            <h1 class="titulo">Cardápio</h1>
        </div>
        <button type="button" class="btn btn-principal" onclick="abrirProduto(this)"
                sec:authorize="hasAnyRole('ADMIN', 'GERENTE')">
            <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#mais"></use></svg>Novo produto
        </button>
    </header>

    <p class="cartao muted" th:if="${#maps.isEmpty(grupos)}">Cardápio vazio.</p>

    <section th:each="grupo : ${grupos}">
        <h2 class="grupo-cabecalho">
            <span th:text="${grupo.key}"></span><span class="mono" th:text="${#lists.size(grupo.value)}"></span>
        </h2>
        <div class="produtos">
            <article class="produto" th:each="produto : ${grupo.value}"
                     th:classappend="${produto.disponivelParaVenda()} ? '' : 'pausado'">
                <div class="produto-topo">
                    <h3 th:text="${produto.nome}"></h3>
                    <span class="selo selo-p" th:classappend="${produto.disponivelParaVenda()} ? 'a-venda' : 'em-pausa'"
                          th:text="${produto.disponivelParaVenda()} ? 'À venda' : 'Pausado'"></span>
                </div>
                <div class="produto-base">
                    <span class="produto-preco" th:text="${@exibir.moeda(produto.preco)}"></span>
                    <div class="linha-acoes" sec:authorize="hasAnyRole('ADMIN', 'GERENTE')">
                        <button type="button" class="btn btn-borda btn-icone" th:aria-label="${'Editar ' + produto.nome}"
                                th:data-id="${produto.id}" th:data-nome="${produto.nome}" th:data-tipo="${produto.tipo}"
                                th:data-preco="${produto.preco}" th:data-ativo="${produto.ativo}"
                                onclick="abrirProduto(this)">
                            <svg class="ic ic-sm" aria-hidden="true"><use href="/images/icones.svg#editar"></use></svg>
                        </button>
                        <button type="button" class="btn btn-perigo-borda btn-icone" th:aria-label="${'Remover ' + produto.nome}"
                                th:data-id="${produto.id}" onclick="removerProduto(this.dataset.id)">
                            <svg class="ic ic-sm" aria-hidden="true"><use href="/images/icones.svg#lixo"></use></svg>
                        </button>
                    </div>
                </div>
            </article>
        </div>
    </section>

    <!-- Modal unico para criar e editar (so ADMIN/GERENTE) -->
    <dialog class="modal" id="modalProduto" aria-labelledby="tituloProduto" sec:authorize="hasAnyRole('ADMIN', 'GERENTE')">
        <form onsubmit="salvarProduto(event)">
            <div class="modal-topo">
                <h2 class="modal-titulo" id="tituloProduto">Produto</h2>
                <button type="button" class="modal-fechar" aria-label="Fechar" onclick="this.closest('dialog').close()">
                    <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#fechar"></use></svg>
                </button>
            </div>

            <input type="hidden" id="produtoId">
            <label class="campo">Nome
                <input type="text" id="produtoNome" class="entrada" maxlength="100" required>
            </label>
            <div class="grade-2" style="grid-template-columns: 1fr 1fr">
                <label class="campo">Tipo
                    <select id="produtoTipo" class="entrada">
                        <option>Pizza</option>
                        <option>Esfiha</option>
                        <option>Lanche</option>
                        <option>Bebida</option>
                        <option>Porção</option>
                        <option>Adicional</option>
                    </select>
                </label>
                <label class="campo">Preço (R$)
                    <input type="number" id="produtoPreco" class="entrada mono" step="0.01" min="0.01" required>
                </label>
            </div>
            <label class="interruptor">
                <input type="checkbox" id="produtoAtivo">Disponível para venda
            </label>

            <div class="modal-rodape">
                <button type="button" class="btn btn-borda btn-lg" onclick="this.closest('dialog').close()">Voltar</button>
                <button type="submit" class="btn btn-principal btn-lg">Salvar</button>
            </div>
        </form>
    </dialog>

    <script>
        // O mesmo modal serve para novo (botao sem data-id) e edicao (botao com data-id)
        function abrirProduto(botao) {
            const dados = botao.dataset;
            document.getElementById('tituloProduto').textContent = dados.id ? 'Editar produto' : 'Novo produto';
            document.getElementById('produtoId').value = dados.id || '';
            document.getElementById('produtoNome').value = dados.nome || '';
            document.getElementById('produtoTipo').value = dados.tipo || 'Pizza';
            document.getElementById('produtoPreco').value = dados.preco || '';
            document.getElementById('produtoAtivo').checked = dados.id ? dados.ativo === 'true' : true;
            document.getElementById('modalProduto').showModal();
        }

        async function salvarProduto(evento) {
            evento.preventDefault();
            const id = document.getElementById('produtoId').value;
            const produto = {
                nome: document.getElementById('produtoNome').value,
                tipo: document.getElementById('produtoTipo').value,
                preco: Number(document.getElementById('produtoPreco').value),
                ativo: document.getElementById('produtoAtivo').checked
            };
            const url = id ? `/api/produtos/${encodeURIComponent(id)}` : '/api/produtos';
            if (await PP.api(url, id ? 'PUT' : 'POST', produto)) {
                location.reload();
            }
        }

        async function removerProduto(id) {
            if (!confirm('Remover este produto do cardápio?')) return;
            if (await PP.api(`/api/produtos/${encodeURIComponent(id)}`, 'DELETE')) {
                location.reload();
            }
        }
    </script>

</div>

</body>
</html>
