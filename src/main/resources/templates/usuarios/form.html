<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Usuário</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="/usuarios" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
        <h2 class="fw-bold mb-0" th:text="${usuarioId == null} ? 'Novo usuário' : 'Editar usuário'"></h2>
    </div>

    <div class="alert alert-danger" style="max-width: 520px;" th:if="${erro}" th:text="${erro}"></div>

    <div class="card shadow-sm" style="max-width: 520px;">
        <div class="card-body p-4">
            <!-- th:action ja insere o campo _csrf escondido -->
            <form th:action="${usuarioId == null} ? @{/usuarios/salvar} : @{/usuarios/editar/{id}(id=${usuarioId})}"
                  th:object="${usuario}" method="post">

                <div class="mb-3">
                    <label for="username" class="form-label">Login</label>
                    <input type="text" id="username" class="form-control" th:field="*{username}"
                           placeholder="ex.: maria.souza" autocomplete="off" required>
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">
                        Senha <small class="text-muted" th:if="${usuarioId != null}">(em branco mantém a atual)</small>
                    </label>
                    <input type="password" id="senha" class="form-control" th:field="*{senha}"
                           minlength="8" autocomplete="new-password" th:required="${usuarioId == null}">
                </div>

                <fieldset class="mb-4">
                    <legend class="form-label fs-6">Perfil</legend>
                    <div class="form-check" th:each="p : ${perfis}">
                        <input class="form-check-input" type="radio" th:field="*{perfil}" th:value="${p}">
                        <label class="form-check-label" th:for="${#ids.prev('perfil')}" th:text="${p.rotulo}"></label>
                    </div>
                </fieldset>

                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Salvar</button>
                <a href="/usuarios" class="btn btn-link">Cancelar</a>
            </form>
        </div>
    </div>

</div>

</body>
</html>
