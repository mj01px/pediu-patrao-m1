<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" class="tela" style="gap: 24px">

    <header class="cabecalho">
        <div>
            <div class="sobretitulo" th:text="${#lists.size(usuarios) == 1} ? '1 pessoa' : ${#lists.size(usuarios) + ' pessoas'}"></div>
            <h1 class="titulo">Equipe</h1>
        </div>
        <a href="/usuarios/novo" class="btn btn-principal">
            <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#mais"></use></svg>Novo usuário
        </a>
    </header>

    <div class="aviso aviso-ok" role="status" th:if="${sucesso}">
        <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#check"></use></svg><span th:text="${sucesso}"></span>
    </div>
    <div class="aviso aviso-erro" role="alert" th:if="${erro}">
        <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#erro"></use></svg><span th:text="${erro}"></span>
    </div>

    <div class="cartao-lista">
        <div class="pessoa" th:each="usuario : ${usuarios}"
             th:with="perfil=${usuario.perfil != null ? usuario.perfil.name() : ''}">
            <span class="avatar" th:classappend="${'perfil-' + perfil}"
                  th:text="${#strings.toUpperCase(#strings.substring(usuario.username, 0, 1))}"></span>
            <div class="pessoa-nome">
                <span th:text="${usuario.username}"></span>
                <span class="selo selo-p voce" th:if="${usuario.username == #authentication.name}">você</span>
            </div>
            <span class="selo selo-perfil" th:classappend="${'perfil-' + perfil}"
                  th:text="${usuario.perfil?.rotulo} ?: 'Sem perfil'"></span>
            <div class="pessoa-acoes">
                <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}" class="btn btn-borda btn-p">Editar</a>
                <!-- O proprio usuario nao ve "Remover" (e o service tambem bloqueia) -->
                <form th:unless="${usuario.username == #authentication.name}"
                      th:action="@{/usuarios/deletar/{id}(id=${usuario.id})}" method="post"
                      onsubmit="return confirm('Remover este usuário?')">
                    <button type="submit" class="btn btn-perigo-borda btn-p">Remover</button>
                </form>
            </div>
        </div>
    </div>

    <p class="com-icone" style="align-items: flex-start; max-width: 720px">
        <svg class="ic" aria-hidden="true" style="margin-top: 3px"><use href="/images/icones.svg#escudo"></use></svg>
        Ninguém altera o próprio perfil nem remove a si mesmo, e o sistema sempre mantém pelo menos um administrador.
    </p>

</div>

</body>
</html>
