<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <!-- Esconder menus aqui e so conforto visual: quem barra de verdade e o backend.
         A tela ativa sai do nome do template que o Telas.abrir colocou em ${content}. -->
    <nav th:fragment="sidebar" id="menu" class="menu" aria-label="Menu principal"
         th:with="tela=${content ?: ''}">
        <a class="marca" th:href="@{/}">
            <span class="marca-icone"><svg class="ic" aria-hidden="true"><use href="/images/icones.svg#logo"></use></svg></span>
            <span class="marca-nome">Pediu Patrão</span>
        </a>

        <ul class="menu-lista">
            <li>
                <a th:href="@{/}" th:classappend="${#strings.startsWith(tela, 'home')} ? 'ativo'">
                    <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#casa"></use></svg>Início
                </a>
            </li>
            <li>
                <a th:href="@{/pedidos}" th:classappend="${#strings.startsWith(tela, 'pedidos')} ? 'ativo'">
                    <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#quadro"></use></svg>Pedidos
                </a>
            </li>
            <li sec:authorize="hasAnyRole('GERENTE', 'ATENDENTE')">
                <a th:href="@{/clientes}" th:classappend="${#strings.startsWith(tela, 'clientes')} ? 'ativo'">
                    <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#clientes"></use></svg>Clientes
                </a>
            </li>
            <li>
                <a th:href="@{/produtos}" th:classappend="${#strings.startsWith(tela, 'produtos')} ? 'ativo'">
                    <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#cardapio"></use></svg>Cardápio
                </a>
            </li>
            <li sec:authorize="hasAnyRole('ADMIN', 'GERENTE')">
                <a th:href="@{/auditoria}" th:classappend="${#strings.startsWith(tela, 'auditoria')} ? 'ativo'">
                    <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#auditoria"></use></svg>Auditoria
                </a>
            </li>
            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/usuarios}" th:classappend="${#strings.startsWith(tela, 'usuarios')} ? 'ativo'">
                    <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#equipe"></use></svg>Equipe
                </a>
            </li>
        </ul>

        <div class="menu-rodape" sec:authorize="isAuthenticated()">
            <div class="quem" th:each="papel : ${#authentication.authorities}"
                 th:with="perfil=${#strings.replace(papel.authority, 'ROLE_', '')}">
                <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 1))}">A</span>
                <div>
                    <span class="quem-nome" sec:authentication="name"></span>
                    <span class="selo selo-p" th:classappend="${'perfil-' + perfil}"
                          th:text="${#strings.capitalize(#strings.toLowerCase(perfil))}"></span>
                </div>
            </div>
            <!-- Logout e POST com CSRF (o th:action coloca o token sozinho) -->
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn-sair">
                    <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#sair"></use></svg>Sair
                </button>
            </form>
        </div>
    </nav>
</body>
</html>
