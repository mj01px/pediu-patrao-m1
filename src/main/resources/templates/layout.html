<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Token CSRF lido pelo PP.cabecalhoCsrf() do script.js -->
        <meta name="csrf-token" th:content="${_csrf.token}">
        <meta name="csrf-header" th:content="${_csrf.headerName}">
        <title>Pediu Patrão</title>
        <th:block th:replace="~{fragments/recursos :: recursos}"></th:block>
        <script th:src="@{/js/script.js}"></script>
    </head>
    <body>
        <div class="app">
            <!-- Barra do topo: so aparece em telas pequenas, abre o menu -->
            <header class="topo-mobile">
                <a class="marca" th:href="@{/}">
                    <span class="marca-icone"><svg class="ic" aria-hidden="true"><use href="/images/icones.svg#logo"></use></svg></span>
                    <span class="marca-nome">Pediu Patrão</span>
                </a>
                <button type="button" id="abrirMenu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
                    <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#menu"></use></svg>
                </button>
            </header>

            <div th:replace="~{fragments/sidebar :: sidebar}"></div>

            <main class="conteudo">
                <div th:replace="~{__${content}__}"></div>
            </main>
        </div>

        <!-- Avisos flutuantes do PP.avisar() -->
        <div id="avisos" aria-live="polite"></div>
    </body>
</html>
