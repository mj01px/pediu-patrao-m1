<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Novo Pedido</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="/pedidos" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
        <h2 class="fw-bold mb-0">Novo pedido</h2>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header fw-medium"><i class="bi bi-journal-text me-1"></i>Cardápio</div>
                <div class="card-body p-0">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-3">Produto</th>
                                <th>Tipo</th>
                                <th class="text-end">Preço</th>
                                <th style="width: 120px;">Qtd</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(produtos)}">
                                <td colspan="4" class="text-center text-muted py-4">Nenhum produto disponível.</td>
                            </tr>
                            <tr th:each="produto : ${produtos}">
                                <td class="ps-3" th:text="${produto.nome}"></td>
                                <td class="text-muted small" th:text="${produto.tipo}"></td>
                                <td class="text-end" th:text="${'R$ ' + #numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                                <td>
                                    <input type="number" class="form-control form-control-sm quantidade" min="0" max="99" value="0"
                                           th:data-produto="${produto.id}" th:data-preco="${produto.preco}"
                                           oninput="atualizarResumo()">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <label for="cliente" class="form-label fw-medium">Cliente</label>
                    <select id="cliente" class="form-select mb-3">
                        <option value="" selected disabled>Escolha o cliente</option>
                        <option th:each="cliente : ${clientes}" th:value="${cliente.id}"
                                th:text="${cliente.nome + ' (' + cliente.telefone + ')'}"></option>
                    </select>

                    <label for="observacao" class="form-label fw-medium">Observação</label>
                    <textarea id="observacao" class="form-control mb-3" rows="2" maxlength="300"
                              placeholder="Ex.: metade sem cebola"></textarea>

                    <div class="d-flex justify-content-between border-top pt-3">
                        <span>Prévia do total</span>
                        <strong id="previaTotal">R$ 0,00</strong>
                    </div>
                    <p class="text-muted small">O total oficial é calculado pelo servidor com os preços do cardápio.</p>

                    <button type="button" class="btn btn-primary w-100" onclick="registrarPedido()">
                        <i class="bi bi-send me-1"></i> Registrar pedido
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function itensEscolhidos() {
            return [...document.querySelectorAll('.quantidade')]
                .map(campo => ({ campo, quantidade: Number(campo.value) || 0 }))
                .filter(item => item.quantidade > 0);
        }

        function atualizarResumo() {
            const total = itensEscolhidos()
                .reduce((soma, item) => soma + Number(item.campo.dataset.preco) * item.quantidade, 0);
            document.getElementById('previaTotal').textContent = PP.moeda(total);
        }

        // Vai so cliente, produto e quantidade. Preco e total ficam com o servidor.
        async function registrarPedido() {
            const pedido = {
                clienteId: document.getElementById('cliente').value,
                observacao: document.getElementById('observacao').value,
                itens: itensEscolhidos().map(item => ({ produtoId: item.campo.dataset.produto, quantidade: item.quantidade }))
            };
            if (await PP.api('/api/pedidos', 'POST', pedido)) {
                window.location.href = '/pedidos';
            }
        }
    </script>

</div>

</body>
</html>
