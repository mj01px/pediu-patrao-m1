<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" class="tela">

    <header class="cabecalho-volta">
        <a href="/pedidos" class="btn-voltar" aria-label="Voltar ao quadro">
            <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#voltar"></use></svg>
        </a>
        <h1 class="titulo" style="margin: 0">Novo pedido</h1>
    </header>

    <div class="duas-colunas">
        <section class="principal" aria-label="Cardápio">
            <p class="cartao muted" th:if="${#maps.isEmpty(grupos)}">Nenhum produto disponível no cardápio.</p>
            <div th:each="grupo : ${grupos}">
                <h2 class="grupo-titulo" th:text="${grupo.key}"></h2>
                <div class="cartao-lista">
                    <div class="produto-linha" th:each="produto : ${grupo.value}">
                        <div>
                            <div class="produto-nome" th:text="${produto.nome}"></div>
                            <div class="mono muted" style="font-size: 14px; font-weight: 500" th:text="${@exibir.moeda(produto.preco)}"></div>
                        </div>
                        <div class="passo" role="group" th:aria-label="${'Quantidade de ' + produto.nome}">
                            <button type="button" class="menos" aria-label="Diminuir" onclick="mudarQuantidade(this, -1)">−</button>
                            <output class="quantidade" th:data-produto="${produto.id}" th:data-preco="${produto.preco}"
                                    th:data-nome="${produto.nome}">0</output>
                            <button type="button" class="mais" aria-label="Aumentar" onclick="mudarQuantidade(this, 1)">+</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <aside class="lateral cartao resumo" aria-label="Resumo do pedido">
            <div class="resumo-topo">
                <h2 class="subtitulo" style="font-size: 22px">Comanda</h2>
                <span class="pequeno muted" th:text="${'entrada por ' + #authentication.name}"></span>
            </div>

            <label class="campo">Cliente
                <select id="cliente" class="entrada">
                    <option value="" selected disabled>Escolha o cliente</option>
                    <option th:each="cliente : ${clientes}" th:value="${cliente.id}"
                            th:text="${cliente.nome + ' · ' + cliente.telefone}"></option>
                </select>
                <span class="campo-dica" th:if="${#lists.isEmpty(clientes)}">
                    Nenhum cliente cadastrado. <a href="/clientes">Ver clientes</a>
                </span>
            </label>

            <div class="resumo-itens" id="resumoItens">
                <span class="muted">Use o + ao lado dos produtos para montar o pedido.</span>
            </div>

            <label class="campo">
                <span>Observação <span class="campo-dica">opcional, até 300 caracteres</span></span>
                <textarea id="observacao" class="entrada" rows="2" maxlength="300" placeholder="Ex.: metade sem cebola"></textarea>
            </label>

            <div class="item-linha">
                <span style="font-weight: 600">Prévia do total</span>
                <span class="valor-grande" id="previaTotal">R$ 0,00</span>
            </div>
            <p class="pequeno muted" style="margin-top: -8px">O valor oficial é calculado pelo servidor com os preços do cardápio.</p>

            <button type="button" class="btn btn-principal btn-xl btn-bloco" id="registrar" onclick="registrarPedido()">
                <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#check"></use></svg>Registrar pedido
            </button>
        </aside>
    </div>

    <script>
        function mudarQuantidade(botao, passo) {
            const campo = botao.parentElement.querySelector('.quantidade');
            const nova = Math.min(99, Math.max(0, (Number(campo.value) || 0) + passo));
            campo.value = nova;
            botao.parentElement.classList.toggle('marcado', nova > 0);
            atualizarResumo();
        }

        function itensEscolhidos() {
            return [...document.querySelectorAll('.quantidade')]
                .map(campo => ({ campo, quantidade: Number(campo.value) || 0 }))
                .filter(item => item.quantidade > 0);
        }

        // Monta a comanda ao lado: uma linha por produto escolhido
        function atualizarResumo() {
            const itens = itensEscolhidos();
            const lista = document.getElementById('resumoItens');
            lista.innerHTML = itens.length === 0
                ? '<span class="muted">Use o + ao lado dos produtos para montar o pedido.</span>'
                : itens.map(item => `
                    <div class="item-linha">
                        <span>${item.quantidade}× ${PP.texto(item.campo.dataset.nome)}</span>
                        <span>${PP.moeda(Number(item.campo.dataset.preco) * item.quantidade)}</span>
                    </div>`).join('');
            const total = itens.reduce((soma, item) => soma + Number(item.campo.dataset.preco) * item.quantidade, 0);
            document.getElementById('previaTotal').textContent = PP.moeda(total);
        }

        // Vai so cliente, produto e quantidade. Preco e total ficam com o servidor.
        async function registrarPedido() {
            const botao = document.getElementById('registrar');
            const pedido = {
                clienteId: document.getElementById('cliente').value,
                observacao: document.getElementById('observacao').value,
                itens: itensEscolhidos().map(item => ({ produtoId: item.campo.dataset.produto, quantidade: item.quantidade }))
            };
            botao.disabled = true;
            if (await PP.api('/api/pedidos', 'POST', pedido)) {
                window.location.href = '/pedidos';
            } else {
                botao.disabled = false;
            }
        }
    </script>

</div>

</body>
</html>
