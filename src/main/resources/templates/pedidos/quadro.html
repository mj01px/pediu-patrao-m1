<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="content" class="tela">

    <header class="cabecalho">
        <div>
            <div class="sobretitulo" th:text="${emAndamento + ' em andamento'}"></div>
            <h1 class="titulo">Quadro de pedidos</h1>
        </div>
        <div class="acoes">
            <label class="busca">
                <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#busca"></use></svg>
                <input type="search" id="buscaPedido" class="entrada" style="height: 44px; width: 260px"
                       aria-label="Buscar pedido" placeholder="Buscar cliente ou código" oninput="filtrarQuadro()">
            </label>
            <a href="/pedidos/novo" class="btn btn-principal" sec:authorize="hasAnyRole('GERENTE', 'ATENDENTE')">
                <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#mais"></use></svg>Novo pedido
            </a>
        </div>
    </header>

    <div class="aviso aviso-erro" role="alert" th:if="${erro}" th:text="${erro}"></div>

    <!-- Colunas ativas: Recebidos, No forno, Prontos, Sairam -->
    <div class="quadro">
        <section class="coluna" th:each="coluna : ${colunas}">
            <div class="coluna-topo">
                <h2 class="coluna-titulo" th:classappend="${'s-' + coluna.estilo}">
                    <span class="ponto"></span><span th:text="${coluna.titulo}"></span>
                </h2>
                <span class="contagem" th:text="${#lists.size(coluna.pedidos)}"></span>
            </div>
            <p class="coluna-vazia" th:if="${#lists.isEmpty(coluna.pedidos)}">Nada por aqui.</p>
            <th:block th:each="pedido : ${coluna.pedidos}">
                <article th:replace="~{pedidos/cartao :: cartao(${pedido})}"></article>
            </th:block>
        </section>
    </div>

    <!-- Pedidos finalizados e cancelados -->
    <section class="pilha">
        <h2 class="subtitulo">Encerrados</h2>
        <div class="cartao-lista rolagem">
            <table class="tabela" style="min-width: 720px">
                <thead>
                    <tr>
                        <th>Pedido</th>
                        <th>Cliente</th>
                        <th>Situação</th>
                        <th class="direita">Total</th>
                        <th><span class="sr-only">Ações</span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(encerrados)}">
                        <td colspan="5" class="vazio">Nenhum pedido encerrado.</td>
                    </tr>
                    <tr th:each="pedido : ${encerrados}"
                        th:data-busca="${#strings.toLowerCase(pedido.nomeCliente + ' ' + @exibir.codigo(pedido.id))}">
                        <td class="mono muted" style="font-size: 13px"
                            th:text="${@exibir.codigo(pedido.id) + ' · ' + #temporals.format(pedido.entrada.momento, 'dd/MM HH:mm')}"></td>
                        <td style="font-weight: 600" th:text="${pedido.nomeCliente}"></td>
                        <td>
                            <span class="selo" th:classappend="${'s-' + pedido.status}">
                                <span class="ponto"></span><span th:text="${pedido.status.rotulo}"></span>
                            </span>
                            <span class="pequeno muted" style="margin-left: 10px" th:if="${pedido.cancelamento != null}"
                                  th:text="${pedido.motivoCancelamento}"></span>
                        </td>
                        <td class="direita mono" th:classappend="${pedido.cancelamento != null} ? 'riscado'"
                            th:text="${@exibir.moeda(pedido.total)}"></td>
                        <td class="direita">
                            <a th:href="@{/pedidos/{id}(id=${pedido.id})}" style="font-weight: 600; font-size: 14px">Detalhes</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <th:block th:replace="~{pedidos/acoes :: acoes}"></th:block>

    <script>
        // Filtro so na tela: esconde comandas e linhas que nao batem com o texto
        function filtrarQuadro() {
            const termo = document.getElementById('buscaPedido').value.trim().toLowerCase();
            document.querySelectorAll('[data-busca]').forEach(el => {
                el.hidden = termo !== '' && !el.dataset.busca.includes(termo);
            });
        }
    </script>

</div>

</body>
</html>
