<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Comanda de um pedido no quadro. Uso: th:replace="~{pedidos/cartao :: cartao(${pedido})}" -->
<article th:fragment="cartao(pedido)" class="comanda"
         th:data-busca="${#strings.toLowerCase(pedido.nomeCliente + ' ' + @exibir.codigo(pedido.id))}">

    <div class="comanda-topo">
        <span class="mono" th:text="${@exibir.codigo(pedido.id) + ' · ' + #temporals.format(pedido.entrada.momento, 'HH:mm')}"></span>
        <a th:href="@{/pedidos/{id}(id=${pedido.id})}" aria-label="Ver detalhes do pedido">
            <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#abrir"></use></svg>
        </a>
    </div>

    <div class="comanda-cliente" th:text="${pedido.nomeCliente}"></div>

    <ul class="comanda-itens">
        <li th:each="item : ${pedido.itens}" th:text="${item.quantidade + '× ' + item.descricao}"></li>
    </ul>

    <div class="comanda-nota" th:text="${'Entrada por ' + pedido.entrada.usuario}"></div>
    <div class="comanda-saida" th:if="${pedido.saida != null}"
         th:text="${pedido.status.rotulo + ' às ' + #temporals.format(pedido.saida.momento, 'HH:mm') + ' · ' + pedido.saida.usuario}"></div>

    <div class="comanda-total">
        <span class="mono" th:text="${@exibir.moeda(pedido.total)}"></span>
        <span class="selo-desconto" th:if="${pedido.percentualDesconto.signum() > 0}"
              th:text="${'−' + @exibir.percentual(pedido.percentualDesconto)}"></span>
    </div>

    <div class="comanda-botoes">
        <!-- Botoes de avanco: so as etapas que o fluxo permite -->
        <th:block sec:authorize="hasAnyRole('GERENTE', 'ATENDENTE')">
            <button th:each="etapa : ${pedido.status.seguintes()}" type="button" class="btn btn-escuro btn-p"
                    th:data-pedido="${pedido.id}" th:data-etapa="${etapa.name()}"
                    th:text="${etapa.marcaSaida()} ? ${etapa.rotulo} : ${'Mover: ' + etapa.rotulo}"
                    onclick="moverPedido(this)"></button>
        </th:block>
        <!-- Desconto e cancelamento: so GERENTE e so com o pedido ainda na loja -->
        <th:block sec:authorize="hasRole('GERENTE')" th:if="${pedido.status.emAberto()}">
            <button type="button" class="btn btn-ok-borda btn-icone" aria-label="Aplicar desconto"
                    th:data-pedido="${pedido.id}" th:data-subtotal="${pedido.subtotal}"
                    th:data-percentual="${pedido.percentualDesconto}"
                    th:data-rotulo="${@exibir.codigo(pedido.id) + ' · ' + pedido.nomeCliente}"
                    onclick="abrirDesconto(this)">
                <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#desconto"></use></svg>
            </button>
            <button type="button" class="btn btn-perigo-borda btn-icone" aria-label="Cancelar pedido"
                    th:data-pedido="${pedido.id}"
                    th:data-rotulo="${@exibir.codigo(pedido.id) + ' · ' + pedido.nomeCliente}"
                    onclick="abrirCancelamento(this)">
                <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#fechar"></use></svg>
            </button>
        </th:block>
    </div>
</article>

</body>
</html>
