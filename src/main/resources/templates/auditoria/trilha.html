<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold mb-0"><i class="bi bi-fingerprint me-2 text-primary"></i>Trilha de auditoria</h2>
        <span class="text-muted small"><i class="bi bi-lock-fill"></i> somente leitura</span>
    </div>

    <form method="get" th:action="@{/auditoria}" class="d-flex flex-wrap gap-2 mb-3">
        <select name="entidade" class="form-select w-auto">
            <option value="">Tudo</option>
            <option th:each="e : ${entidades}" th:value="${e}" th:text="${e}" th:selected="${e == entidade}"></option>
        </select>
        <input type="text" name="registroId" class="form-control w-auto" placeholder="ID do registro"
               th:value="${registroId}">
        <button type="submit" class="btn btn-primary">Filtrar</button>
        <a href="/auditoria" class="btn btn-link">Limpar</a>
    </form>

    <p class="text-muted" th:if="${#lists.isEmpty(eventos)}">Nenhum evento registrado.</p>

    <div class="card shadow-sm mb-2" th:each="evento : ${eventos}">
        <div class="card-body py-2">
            <div class="d-flex flex-wrap justify-content-between gap-2">
                <div>
                    <span class="fw-semibold" th:text="${evento.tipo.rotulo}"></span>
                    <a class="small text-muted ms-2"
                       th:href="@{/auditoria(entidade=${evento.entidade}, registroId=${evento.registroId})}"
                       th:text="${evento.entidade + ' #' + evento.registroId}"
                       title="Ver todo o histórico deste registro"></a>
                </div>
                <div class="small">
                    <i class="bi bi-person"></i> <span th:text="${evento.usuario}"></span>
                    <span class="badge" th:classappend="${'text-bg-' + (evento.perfil?.cor ?: 'light')}"
                          th:text="${evento.perfil}"></span>
                    <span class="text-muted ms-2" th:text="${#temporals.format(evento.momento, 'dd/MM/yyyy HH:mm:ss')}"></span>
                </div>
            </div>

            <table class="table table-sm table-borderless small mb-0 mt-1" th:unless="${#lists.isEmpty(evento.mudancas)}">
                <tr th:each="m : ${evento.mudancas}">
                    <td class="text-muted" style="width: 160px;" th:text="${m.campo}"></td>
                    <td><del class="text-danger" th:text="${m.de} ?: '(vazio)'"></del></td>
                    <td style="width: 24px;">→</td>
                    <td class="text-success" th:text="${m.para} ?: '(vazio)'"></td>
                </tr>
            </table>

            <div class="small mt-1" th:if="${evento.justificativa}">
                <i class="bi bi-chat-quote"></i> <em th:text="${evento.justificativa}"></em>
            </div>
        </div>
    </div>

    <p class="text-muted small mt-3">Até 300 eventos mais recentes. Telefones aparecem só com os 4 últimos dígitos.</p>

</div>

</body>
</html>
