<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="content" class="tela" th:with="editando=${cliente.id != null}">

    <header class="cabecalho-volta">
        <a href="/clientes" class="btn-voltar" aria-label="Voltar para clientes">
            <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#voltar"></use></svg>
        </a>
        <div>
            <div class="sobretitulo" th:text="${editando} ? 'Editar cliente' : 'Clientes'"></div>
            <h1 class="titulo" style="margin: 0"
                th:text="${editando and !#strings.isEmpty(cliente.nome)} ? ${cliente.nome} : 'Novo cliente'"></h1>
        </div>
    </header>

    <!-- Mensagem de regra de negocio vinda do ClienteService -->
    <div class="aviso aviso-erro" role="alert" style="max-width: 880px" th:if="${erro}">
        <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#erro"></use></svg><span th:text="${erro}"></span>
    </div>

    <form th:action="${editando} ? @{/clientes/editar/{id}(id=${cliente.id})} : @{/clientes/salvar}"
          th:object="${cliente}" method="post" class="tela" style="max-width: 880px; gap: 20px"
          th:data-editando="${editando}">

        <section class="cartao" style="gap: 18px">
            <h2 class="subtitulo" style="font-weight: 600">Contato</h2>
            <div class="grade-2">
                <label class="campo">
                    <span>Nome <span class="campo-dica">obrigatório</span></span>
                    <input type="text" class="entrada" th:field="*{nome}" placeholder="Ex.: João da Silva" required>
                    <span class="campo-dica antes" hidden></span>
                </label>
                <label class="campo">
                    <span>Telefone <span class="campo-dica">obrigatório</span></span>
                    <input type="tel" class="entrada mono" th:field="*{telefone}" placeholder="(11) 99999-9999" required>
                    <span class="campo-dica antes" hidden></span>
                </label>
            </div>
        </section>

        <section class="cartao" style="gap: 18px">
            <h2 class="subtitulo" style="font-weight: 600">Endereço de entrega</h2>
            <div class="grade-6">
                <div class="campo c2">
                    <label for="cep">CEP</label>
                    <div class="cep">
                        <input type="text" class="entrada mono" th:field="*{cep}" placeholder="00000-000" maxlength="9">
                        <button type="button" class="btn btn-borda" id="btnBuscarCep" aria-label="Buscar CEP" style="height: 48px; padding: 0 14px">
                            <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#busca"></use></svg>
                        </button>
                    </div>
                    <span class="campo-dica erro" id="cepErro" hidden>CEP não encontrado.</span>
                </div>
                <label class="campo c4">Logradouro
                    <input type="text" class="entrada" th:field="*{logradouro}" placeholder="Ex.: Rua das Flores">
                    <span class="campo-dica antes" hidden></span>
                </label>
                <label class="campo c2">Número
                    <input type="text" class="entrada" th:field="*{numero}" placeholder="Ex.: 123">
                    <span class="campo-dica antes" hidden></span>
                </label>
                <label class="campo c4">Complemento
                    <input type="text" class="entrada" th:field="*{complemento}" placeholder="Apartamento, bloco, referência">
                    <span class="campo-dica antes" hidden></span>
                </label>
                <label class="campo c2">Bairro
                    <input type="text" class="entrada" th:field="*{bairro}" placeholder="Ex.: Centro">
                    <span class="campo-dica antes" hidden></span>
                </label>
                <label class="campo c3">Cidade
                    <input type="text" class="entrada" th:field="*{cidade}" placeholder="Ex.: São Paulo">
                    <span class="campo-dica antes" hidden></span>
                </label>
                <label class="campo c1">UF
                    <input type="text" class="entrada mono" th:field="*{estado}" placeholder="SP" maxlength="2">
                    <span class="campo-dica antes" hidden></span>
                </label>
            </div>
        </section>

        <div class="form-rodape">
            <span class="com-icone" th:if="${editando}">
                <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#escudo"></use></svg>Cada campo alterado fica registrado na auditoria com o valor anterior.
            </span>
            <span th:unless="${editando}"></span>
            <div class="acoes">
                <a href="/clientes" class="btn btn-borda btn-lg">Cancelar</a>
                <button type="submit" class="btn btn-principal btn-lg"
                        th:text="${editando} ? 'Salvar alterações' : 'Cadastrar cliente'"></button>
            </div>
        </div>
    </form>

    <script>
        // Máscara de CEP e busca automática ao completar 00000-000
        document.getElementById('cep').addEventListener('input', function () {
            let v = this.value.replace(/\D/g, '');
            if (v.length > 5) v = v.slice(0, 5) + '-' + v.slice(5, 8);
            this.value = v;
            if (this.value.length === 9) buscarCep();
        });
        document.getElementById('btnBuscarCep').addEventListener('click', buscarCep);

        async function buscarCep() {
            const cep = document.getElementById('cep').value.replace(/\D/g, '');
            const erro = document.getElementById('cepErro');
            erro.hidden = true;
            if (cep.length !== 8) return;

            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();
                if (data.erro) {
                    erro.textContent = 'CEP não encontrado.';
                    erro.hidden = false;
                    return;
                }
                preencher('logradouro', data.logradouro);
                preencher('bairro', data.bairro);
                preencher('cidade', data.localidade);
                preencher('estado', data.uf);
                document.getElementById('numero').focus();
            } catch (e) {
                erro.textContent = 'Erro ao buscar o CEP. Tente novamente.';
                erro.hidden = false;
            }
        }

        // Dispara "input" para o aviso de valor anterior acompanhar o preenchimento automatico
        function preencher(id, valor) {
            const campo = document.getElementById(id);
            campo.value = valor || '';
            campo.dispatchEvent(new Event('input'));
        }

        // Máscara de telefone
        document.getElementById('telefone').addEventListener('input', function () {
            let v = this.value.replace(/\D/g, '');
            if (v.length <= 10) {
                v = v.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
            } else {
                v = v.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
            }
            this.value = v;
        });

        // Registrado por ultimo para rodar depois das mascaras. Na edicao, mostra embaixo do campo o valor que estava salvo antes (defaultValue = valor vindo do servidor)
        if (document.querySelector('form[data-editando="true"]')) {
            document.querySelectorAll('form[data-editando="true"] .entrada').forEach(campo => {
                const antes = campo.parentElement.querySelector('.antes');
                if (!antes) return;
                campo.addEventListener('input', () => {
                    const mudou = campo.value !== campo.defaultValue;
                    campo.classList.toggle('alterado', mudou);
                    antes.hidden = !mudou;
                    antes.textContent = 'Antes: ' + (campo.defaultValue || '(vazio)');
                });
            });
        }
    </script>

</div>

</body>
</html>
