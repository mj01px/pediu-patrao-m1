<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="content" class="tela" style="gap: 24px">

    <header class="cabecalho">
        <div>
            <div class="sobretitulo" id="totalClientes">&nbsp;</div>
            <h1 class="titulo">Clientes</h1>
        </div>
        <a href="/clientes/novo" class="btn btn-principal" sec:authorize="hasRole('ATENDENTE')">
            <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#mais"></use></svg>Novo cliente
        </a>
    </header>

    <div class="aviso aviso-ok" role="status" th:if="${sucesso}">
        <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#check"></use></svg><span th:text="${sucesso}"></span>
    </div>
    <div class="aviso aviso-erro" role="alert" th:if="${erro}">
        <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#erro"></use></svg><span th:text="${erro}"></span>
    </div>

    <label class="busca" style="max-width: 480px">
        <svg class="ic" aria-hidden="true"><use href="/images/icones.svg#busca"></use></svg>
        <input type="search" id="filtro" class="entrada" aria-label="Buscar cliente"
               placeholder="Buscar por nome ou telefone" oninput="desenharTabela()">
    </label>

    <div class="cartao-lista rolagem">
        <table class="tabela" style="min-width: 760px">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Endereço</th>
                    <th class="direita">Ações</th>
                </tr>
            </thead>
            <tbody id="clientes-tabela">
                <tr><td colspan="4" class="vazio">Carregando…</td></tr>
            </tbody>
        </table>
    </div>

    <!-- th:inline injeta as permissoes do usuario como booleanos JS (so para esconder botoes) -->
    <script th:inline="javascript">
        const PODE_EDITAR = /*[[${#authorization.expression('hasRole(''ATENDENTE'')')}]]*/ false;
        const PODE_REMOVER = /*[[${#authorization.expression('hasRole(''GERENTE'')')}]]*/ false;
        let clientes = [];

        function enderecoResumido(c) {
            const partes = [c.logradouro, c.numero, c.complemento, c.bairro, c.cidade, c.estado]
                .filter(parte => parte && parte.trim() !== '');
            return partes.length ? partes.join(', ') : (c.endereco || '-');
        }

        function acoes(c) {
            const id = encodeURIComponent(c.id);
            let html = '';
            if (PODE_EDITAR) {
                html += `<a href="/clientes/editar/${id}" class="btn btn-borda btn-p">${PP.icone('editar')}Editar</a>`;
            }
            if (PODE_REMOVER) {
                html += `<button type="button" class="btn btn-perigo-borda btn-p" data-id="${PP.texto(c.id)}"
                            onclick="removerCliente(this.dataset.id)">${PP.icone('lixo')}Excluir</button>`;
            }
            return html;
        }

        function desenharTabela() {
            const termo = document.getElementById('filtro').value.toLowerCase();
            const visiveis = clientes.filter(c => (c.nome + ' ' + c.telefone).toLowerCase().includes(termo));
            const corpo = document.getElementById('clientes-tabela');
            document.getElementById('totalClientes').textContent =
                clientes.length === 1 ? '1 cadastrado' : clientes.length + ' cadastrados';

            if (visiveis.length === 0) {
                corpo.innerHTML = '<tr><td colspan="4" class="vazio">Nenhum cliente encontrado.</td></tr>';
                return;
            }
            // PP.texto escapa os dados: um nome como <script> aparece como texto, nao executa
            corpo.innerHTML = visiveis.map(c => `
                <tr>
                    <td>
                        <div class="pessoa-celula">
                            <span class="avatar avatar-claro">${PP.texto((c.nome || '?').charAt(0).toUpperCase())}</span>
                            <span>${PP.texto(c.nome)}</span>
                        </div>
                    </td>
                    <td class="mono" style="font-size: 14px; font-weight: 500">${PP.texto(c.telefone)}</td>
                    <td style="color: var(--tinta-2)">${PP.texto(enderecoResumido(c))}</td>
                    <td><div class="linha-acoes">${acoes(c)}</div></td>
                </tr>`).join('');
        }

        async function carregarClientes() {
            clientes = (await PP.api('/api/clientes')) || [];
            clientes.sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
            desenharTabela();
        }

        async function removerCliente(id) {
            if (!confirm('Excluir este cliente?')) return;
            if (await PP.api(`/api/clientes/${encodeURIComponent(id)}`, 'DELETE')) {
                PP.avisar('Cliente excluído.');
                carregarClientes();
            }
        }

        carregarClientes();
    </script>
</div>
</body>
</html>
