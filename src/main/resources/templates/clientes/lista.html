<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Clientes</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-person-raised-hand me-2 text-primary"></i>Clientes
        </h2>
        <a href="/clientes/novo" class="btn btn-primary" sec:authorize="hasRole('ATENDENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Cliente
        </a>
    </div>

    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

    <input type="search" id="filtro" class="form-control mb-3" placeholder="Buscar por nome ou telefone"
           oninput="desenharTabela()">

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Endereço</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody id="clientes-tabela"></tbody>
            </table>
        </div>
    </div>

    <!-- th:inline injeta as permissoes do usuario como booleanos JS (so para esconder botoes) -->
    <script th:inline="javascript">
        const PODE_EDITAR = /*[[${#authorization.expression('hasRole(''ATENDENTE'')')}]]*/ false;
        const PODE_REMOVER = /*[[${#authorization.expression('hasRole(''GERENTE'')')}]]*/ false;
        let clientes = [];

        function enderecoResumido(c) {
            const partes = [c.logradouro, c.numero, c.complemento, c.bairro, c.cidade, c.estado]
                .filter(parte => parte && parte.trim() !== '');
            return partes.length ? partes.join(', ') : (c.endereco || '-');
        }

        function acoes(c) {
            const id = encodeURIComponent(c.id);
            let html = '';
            if (PODE_EDITAR) {
                html += `<a href="/clientes/editar/${id}" class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil-fill"></i> Editar</a>`;
            }
            if (PODE_REMOVER) {
                html += `<button class="btn btn-sm btn-outline-danger" data-id="${PP.texto(c.id)}" onclick="removerCliente(this.dataset.id)"><i class="bi bi-trash-fill"></i> Excluir</button>`;
            }
            return html;
        }

        function desenharTabela() {
            const termo = document.getElementById('filtro').value.toLowerCase();
            const visiveis = clientes.filter(c => (c.nome + ' ' + c.telefone).toLowerCase().includes(termo));
            const corpo = document.getElementById('clientes-tabela');

            if (visiveis.length === 0) {
                corpo.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-5">Nenhum cliente encontrado.</td></tr>';
                return;
            }
            // PP.texto escapa os dados: um nome como <script> aparece como texto, nao executa
            corpo.innerHTML = visiveis.map(c => `
                <tr>
                    <td>${PP.texto(c.nome)}</td>
                    <td>${PP.texto(c.telefone)}</td>
                    <td>${PP.texto(enderecoResumido(c))}</td>
                    <td class="text-end pe-4 text-nowrap">${acoes(c)}</td>
                </tr>`).join('');
        }

        async function carregarClientes() {
            clientes = (await PP.api('/api/clientes')) || [];
            desenharTabela();
        }

        async function removerCliente(id) {
            if (!confirm('Excluir este cliente?')) return;
            if (await PP.api(`/api/clientes/${encodeURIComponent(id)}`, 'DELETE')) {
                PP.avisar('Cliente excluído.');
                carregarClientes();
            }
        }

        carregarClientes();
    </script>
</div>
</body>
</html>
