# Banco: usa MONGODB_URI se existir; senao, o MongoDB local
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pediupatrao}
spring.data.mongodb.auto-index-creation=true

# Fuso usado para carimbar entrada, saida e auditoria (independe do fuso do servidor)
pediupatrao.fuso-horario=America/Sao_Paulo
# Senha dos usuarios criados na primeira execucao (sobrescreva com PEDIUPATRAO_SENHA_INICIAL)
pediupatrao.senha-inicial=${PEDIUPATRAO_SENHA_INICIAL:Patrao@2026}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Paginas de erro sem detalhes internos (a API usa o TratadorErrosApi, no formato ProblemDetail)
server.error.include-stacktrace=never
server.error.include-message=never

logging.level.com.umc.pediupatrao=INFO
